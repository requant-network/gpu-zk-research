name: CPU reference checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run.py --output results/ci.json
      - run: python -m py_compile gpu_study.py summarize_results.py
      - run: python summarize_results.py
      - run: git diff --exit-code -- results/gpu-summary.csv
